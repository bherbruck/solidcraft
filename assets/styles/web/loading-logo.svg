<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 24 912 1060" width="456" height="530" role="img" aria-labelledby="t d">
  <title id="t">SolidCraft</title>
  <desc id="d">A plain cube drawn in thick lines is cut twice. Each cut starts as a flat footprint on a face and presses into the solid: first a corner block through the left face, then a pocket pressed down from the top. The cut exposes its shaded faces, then the lines fade and the gaps between faces appear, leaving the SolidCraft logo.</desc>
  <defs>
    <linearGradient id="linear-gradient-1" x1="619.14" y1="179.734" x2="694.687" y2="396.761" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d63c6"/>
      <stop offset="1" stop-color="#15499e"/>
    </linearGradient>
    <linearGradient id="linear-gradient-2" x1="619.14" y1="413.244" x2="790.839" y2="605.547" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#459fff"/>
      <stop offset="1" stop-color="#2379e7"/>
    </linearGradient>
    <linearGradient id="linear-gradient-3" x1="632.876" y1="399.508" x2="783.971" y2="968.175" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b66cf"/>
      <stop offset="1" stop-color="#124596"/>
    </linearGradient>
    <linearGradient id="linear-gradient-4" x1="207.063" y1="303.357" x2="426.837" y2="968.175" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#258df5"/>
      <stop offset="1" stop-color="#1461da"/>
    </linearGradient>
    <linearGradient id="linear-gradient-5" x1="385.63" y1="53.364" x2="522.989" y2="510.769" gradientUnits="userSpaceOnUse">
